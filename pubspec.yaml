name: wallpaper_ringtone_app
description: Set wallpapers and ringtones from your device media.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.0.0
  permission_handler: ^11.0.1
  image_cropper: ^12.0.0
  image_picker: ^1.0.4
  just_audio: ^0.9.36
  path_provider: ^2.1.1
  shared_preferences: ^2.2.2
  flutter_riverpod: ^2.4.9
  cached_network_image: ^3.3.0
  file_picker: ^10.1.9
  android_intent_plus: ^4.0.2
  device_info_plus: ^9.1.1
  flutter_wallpaper_manager: ^0.0.4
  wallpaper_manager_flutter: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
